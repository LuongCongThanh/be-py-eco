[project]
name = "be-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "boto3==1.43.69",
    "celery==5.6.3",
    "celery-types>=0.26.0",
    "cryptography==50.0.0",
    "django==5.2.17",
    "django-allauth==65.19.0",
    "django-axes==8.3.1",
    "django-celery-beat==2.9.0",
    "django-cors-headers==4.9.0",
    "django-countries==9.0.0",
    "django-environ==0.14.0",
    "django-filter==26.1",
    "django-otp==1.7.0",
    "django-storages==1.14.6",
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "drf-standardized-errors==0.16.0",
    "filetype==1.2.0",
    "httpx==0.28.1",
    "opensearch-py==3.2.0",
    "phonenumberslite==9.0.36",
    "pillow==12.3.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.4",
    "redis==8.1.0",
    "sentry-sdk==2.67.1",
    "structlog==26.1.0",
    "tenacity==9.1.4",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "django-stubs==6.0.9",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "hypothesis==6.165.3",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "respx==0.23.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "common", "modules", "integrations"]

[tool.mypy]
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

