openapi: 3.1.0
info:
  title: be-py-eco API
  version: 1.0.0
  description: E-commerce backend API for be-py-eco.
paths:
  /api/v1/admin/customers/{customer_id}/disable:
    post:
      operationId: admin_customers_disable_create
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/staff:
    post:
      operationId: admin_staff_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaff'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateStaff'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStaff'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
          description: ''
  /api/v1/admin/staff/login:
    post:
      operationId: admin_staff_login_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/admin/staff/mfa/confirm:
    post:
      operationId: admin_staff_mfa_confirm_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMfa'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmMfa'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmMfa'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/staff/mfa/setup:
    post:
      operationId: admin_staff_mfa_setup_create
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
          description: ''
  /api/v1/storefront/accounts/email-change/confirm:
    post:
      operationId: storefront_accounts_email_change_confirm_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChange'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/email-change/request:
    post:
      operationId: storefront_accounts_email_change_request_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestEmailChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestEmailChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/storefront/accounts/login:
    post:
      operationId: storefront_accounts_login_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/storefront/accounts/login/google:
    post:
      operationId: storefront_accounts_login_google_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/storefront/accounts/me:
    get:
      operationId: storefront_accounts_me_retrieve
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/me/locale:
    patch:
      operationId: storefront_accounts_me_locale_partial_update
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLocalePreference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLocalePreference'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLocalePreference'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/password-reset/confirm:
    post:
      operationId: storefront_accounts_password_reset_confirm_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordReset'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/password-reset/request:
    post:
      operationId: storefront_accounts_password_reset_request_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/storefront/accounts/register:
    post:
      operationId: storefront_accounts_register_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/sessions:
    get:
      operationId: storefront_accounts_sessions_list
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
          description: ''
  /api/v1/storefront/accounts/sessions/{session_id}/revoke:
    post:
      operationId: storefront_accounts_sessions_revoke_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/storefront/accounts/sessions/revoke-all:
    post:
      operationId: storefront_accounts_sessions_revoke_all_create
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/storefront/accounts/token/refresh:
    post:
      operationId: storefront_accounts_token_refresh_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/storefront/accounts/verify-email:
    post:
      operationId: storefront_accounts_verify_email_create
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
