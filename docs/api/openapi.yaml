openapi: 3.1.0
info:
  title: be-py-eco API
  version: 1.0.0
  description: E-commerce backend API for be-py-eco.
paths:
  /api/v1/admin/customers/{customer_id}/disable:
    post:
      operationId: admin_customers_disable_create
      description: Disables the specified customer account and revokes its sessions.
        Requires an audit reason, confirmed MFA on the acting staff member, and an
        `Idempotency-Key` header.
      summary: Disable a customer account
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableCustomer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DisableCustomer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisableCustomer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/staff:
    post:
      operationId: admin_staff_create
      description: Creates a new staff account. Requires the acting staff member to
        have confirmed MFA and an `Idempotency-Key` header.
      summary: Create a staff account
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaff'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateStaff'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStaff'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
          description: ''
  /api/v1/admin/staff/{staff_id}/mfa/reset:
    post:
      operationId: admin_staff_mfa_reset_create
      description: Deletes the target staff member's MFA device, forcing re-enrollment.
        Requires confirmed MFA on the acting staff member and an `Idempotency-Key`
        header.
      summary: Reset staff MFA
      parameters:
      - in: path
        name: staff_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/staff/login:
    post:
      operationId: admin_staff_login_create
      description: Authenticates a staff member with email and password, returning
        access and refresh tokens.
      summary: Log in a staff member
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/admin/staff/mfa/confirm:
    post:
      operationId: admin_staff_mfa_confirm_create
      description: Verifies a TOTP token to activate MFA for the authenticated staff
        member.
      summary: Confirm MFA setup
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMfa'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmMfa'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmMfa'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/staff/mfa/setup:
    post:
      operationId: admin_staff_mfa_setup_create
      description: Generates a new TOTP secret and provisioning URI for the authenticated
        staff member.
      summary: Start MFA setup
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
          description: ''
  /api/v1/storefront/accounts/email-change/confirm:
    post:
      operationId: storefront_accounts_email_change_confirm_create
      description: Confirms the pending email change using the token sent to the new
        address.
      summary: Confirm email change
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChange'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/email-change/request:
    post:
      operationId: storefront_accounts_email_change_request_create
      description: Sends a confirmation link to the new email address for the authenticated
        customer.
      summary: Request email change
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestEmailChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestEmailChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/storefront/accounts/login:
    post:
      operationId: storefront_accounts_login_create
      description: Authenticates a customer with email and password, returning access
        and refresh tokens.
      summary: Log in a customer
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/storefront/accounts/login/google:
    post:
      operationId: storefront_accounts_login_google_create
      description: Authenticates a customer using a Google ID token, returning access
        and refresh tokens.
      summary: Log in with Google
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/storefront/accounts/me:
    get:
      operationId: storefront_accounts_me_retrieve
      description: Returns the profile of the authenticated customer.
      summary: Get current customer
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/me/locale:
    patch:
      operationId: storefront_accounts_me_locale_partial_update
      description: Updates the authenticated customer's preferred locale and currency.
      summary: Update locale preference
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLocalePreference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLocalePreference'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLocalePreference'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/password-reset/confirm:
    post:
      operationId: storefront_accounts_password_reset_confirm_create
      description: Sets a new password using the reset token and returns the updated
        customer profile.
      summary: Confirm password reset
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordReset'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/password-reset/request:
    post:
      operationId: storefront_accounts_password_reset_request_create
      description: Sends a password reset token to the customer's email if the account
        exists.
      summary: Request password reset
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestPasswordReset'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/storefront/accounts/register:
    post:
      operationId: storefront_accounts_register_create
      description: Creates a new customer account and sends an email verification
        link.
      summary: Register a new customer
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/accounts/sessions:
    get:
      operationId: storefront_accounts_sessions_list
      description: Returns the authenticated customer's active login sessions.
      summary: List active sessions
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
          description: ''
  /api/v1/storefront/accounts/sessions/{session_id}/revoke:
    post:
      operationId: storefront_accounts_sessions_revoke_create
      description: Revokes a single active session belonging to the authenticated
        customer.
      summary: Revoke a session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/storefront/accounts/sessions/revoke-all:
    post:
      operationId: storefront_accounts_sessions_revoke_all_create
      description: Revokes all active sessions belonging to the authenticated customer.
      summary: Revoke all sessions
      tags:
      - storefront
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/storefront/accounts/token/refresh:
    post:
      operationId: storefront_accounts_token_refresh_create
      description: Rotates a refresh token and issues a new access/refresh token pair.
      summary: Refresh access token
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/storefront/accounts/verify-email:
    post:
      operationId: storefront_accounts_verify_email_create
      description: Confirms a customer's email using the verification token sent after
        registration.
      summary: Verify email address
      tags:
      - storefront
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: ''
  /api/v1/storefront/localization/suggestion:
    get:
      operationId: storefront_localization_suggestion_retrieve
      description: Suggests a locale, country, and currency for the request based
        on its IP address/headers.
      summary: Suggest locale
      tags:
      - storefront
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleSuggestionResponse'
          description: ''
components:
  schemas:
    ConfirmEmailChange:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ConfirmMfa:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ConfirmPasswordReset:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - token
    CreateStaff:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - password
      - role
    CustomerResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        preferred_locale:
          type: string
        preferred_currency:
          type: string
      required:
      - email
      - email_verified
      - id
      - preferred_currency
      - preferred_locale
    DisableCustomer:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    GoogleLogin:
      type: object
      properties:
        id_token:
          type: string
      required:
      - id_token
    LocaleSuggestionResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        country_code:
          type: string
        locale:
          type: string
        currency:
          type: string
      required:
      - country_code
      - currency
      - locale
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MfaSetupResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        provisioning_uri:
          type: string
      required:
      - provisioning_uri
    PatchedUpdateLocalePreference:
      type: object
      properties:
        locale:
          type: string
        currency:
          type: string
    RefreshToken:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RequestEmailChange:
      type: object
      properties:
        new_email:
          type: string
          format: email
      required:
      - new_email
    RequestPasswordReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    RoleEnum:
      enum:
      - master_admin
      - store_manager
      - order_staff
      type: string
      description: |-
        * `master_admin` - Master Admin
        * `store_manager` - Store Manager
        * `order_staff` - Order Staff
    SessionResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - created_at
      - expires_at
      - id
    StaffLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    StaffResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
      required:
      - email
      - id
      - role
    TokenResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    VerifyEmail:
      type: object
      properties:
        token:
          type: string
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
