  /api/v1/storefront/localization/suggestion:
    get:
      operationId: storefront_localization_suggestion_retrieve
      tags:
      - storefront
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleSuggestionResponse'
          description: ''
components:
  schemas:
    ConfirmEmailChange:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ConfirmMfa:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ConfirmPasswordReset:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - token
    CreateStaff:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - password
      - role
    CustomerResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        preferred_locale:
          type: string
        preferred_currency:
          type: string
      required:
      - email
      - email_verified
      - id
      - preferred_currency
      - preferred_locale
    GoogleLogin:
      type: object
      properties:
        id_token:
          type: string
      required:
      - id_token
    LocaleSuggestionResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        country_code:
          type: string
        locale:
          type: string
        currency:
          type: string
      required:
      - country_code
      - currency
      - locale
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MfaSetupResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        provisioning_uri:
          type: string
      required:
      - provisioning_uri
    PatchedUpdateLocalePreference:
      type: object
      properties:
        locale:
          type: string
        currency:
          type: string
    RefreshToken:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RequestEmailChange:
      type: object
      properties:
        new_email:
          type: string
          format: email
      required:
      - new_email
    RequestPasswordReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    RoleEnum:
      enum:
      - master_admin
      - store_manager
      - order_staff
      type: string
      description: |-
        * `master_admin` - Master Admin
        * `store_manager` - Store Manager
        * `order_staff` - Order Staff
    SessionResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - created_at
      - expires_at
      - id
    StaffLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    StaffResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
      required:
      - email
      - id
      - role
    TokenResponse:
      type: object
      description: Response shape only — used for OpenAPI docs, not for validation.
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    VerifyEmail:
      type: object
      properties:
        token:
          type: string
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
