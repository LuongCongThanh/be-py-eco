services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-be_py_eco}
      POSTGRES_USER: ${POSTGRES_USER:-be_py_eco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-be_py_eco}
    ports:
      # Host port 5433, not 5432 — this machine already has a native
      # PostgreSQL Windows service (postgresql-x64-18) bound to 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-be_py_eco}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
